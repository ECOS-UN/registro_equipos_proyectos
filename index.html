<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Cerrado</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .card {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 450px;
            width: 90%;
            animation: fadeIn 0.6s ease-out;
        }

        .icon-container {
            width: 80px;
            height: 80px;
            background-color: #fff5f5;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px;
        }

        .icon {
            font-size: 40px;
            color: #e53e3e;
        }

        h1 {
            font-size: 24px;
            color: #2d3748;
            margin-bottom: 12px;
            font-weight: 600;
        }

        p {
            font-size: 16px;
            color: #718096;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .divider {
            height: 1px;
            background-color: #e2e8f0;
            width: 80%;
            margin: 0 auto 24px;
        }

        .btn-home {
            display: inline-block;
            padding: 12px 28px;
            background-color: #4a5568;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn-home:hover {
            background-color: #2d3748;
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

    <meta http-equiv="refresh" content="0; url=https://script.google.com/a/macros/un.edu.mx/s/AKfycbwtek-Mr5eMSyK2LeO0XyS94RViKdb6d1vgOn_pyAXNB5GeLzLFBXnJsL6yR8lB1I0/exec">
</head>
  <body>
    <p>Redirigiendo...</p>
  </body>
</html>
